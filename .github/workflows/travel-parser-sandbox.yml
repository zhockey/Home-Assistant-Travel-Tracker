name: Travel Tracker isolated tests

on:
  pull_request:
    paths:
      - "custom_components/travel_tracker/parser.py"
      - "tests/test_travel_parser.py"
      - ".github/workflows/travel-parser-sandbox.yml"
  push:
    branches:
      - feature/travel-parser-mvp
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parser-tests:
    name: Python ${{ matrix.python-version }} / no Home Assistant
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install standalone test runner
        run: python -m pip install pytest==8.4.2
      - name: Check Python syntax
        run: python -m compileall -q custom_components/travel_tracker/parser.py tests/test_travel_parser.py
      - name: Run synthetic itinerary tests, without HA or IMAP credentials
        run: python -m pytest --noconftest -q tests/test_travel_parser.py
